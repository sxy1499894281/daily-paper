name: Deploy Daily Paper Bookshelf

on:
  push:
    branches: [main]
    paths:
      - "issues/**"
      - "scripts/render_bookshelf.py"
      - "profile/topics.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all archived issues
        run: |
          shopt -s nullglob
          files=(issues/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No real issues yet; validating example issue."
            python3 scripts/validate_issue.py examples/issue.json
          else
            for f in "${files[@]}"; do
              python3 scripts/validate_issue.py "$f"
            done
          fi

      - name: Render static bookshelf
        run: |
          shopt -s nullglob
          files=(issues/*.json)
          mkdir -p dist
          if [ ${#files[@]} -eq 0 ]; then
            python3 scripts/render_bookshelf.py --issue examples/issue.json --output dist/index.html
          else
            python3 scripts/render_bookshelf.py --issues-dir issues --output dist/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
